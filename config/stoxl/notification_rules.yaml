version: 1
timezone: Asia/Seoul
default_daily_check_time: "09:00"
auto_publish_allowed: false
auto_submit_allowed: false

notification_rules:
  - notification_id: competition_grant_due_30_days
    target: 공모전/지원사업
    trigger: due_date exists
    timing: 마감 30일 전
    responsible_agent: kasumi
    channel: 일정-마감관리
    required_fields: [후보명, 마감일, source_url, 현재 상태]
    escalation: 메이코에게 요약 전달
  - notification_id: competition_grant_due_14_days
    target: 공모전/지원사업
    trigger: due_date exists
    timing: 마감 14일 전
    responsible_agent: kasumi
    channel: 일정-마감관리
    required_fields: [후보명, 마감일, 제출물, 확인 상태]
    escalation: 메이코 검토 요청
  - notification_id: competition_grant_due_7_days
    target: 공모전/지원사업
    trigger: status in 발견됨/검토중
    timing: 마감 7일 전
    responsible_agent: meiko
    channel: 최종-승인요청
    required_fields: [지원 추천, 리스크, 승인 필요]
    escalation: 결정권자 승인 요청
  - notification_id: competition_grant_due_3_days
    target: 공모전/지원사업
    trigger: status=승인됨
    timing: 마감 3일 전
    responsible_agent: meiko
    channel: 일정-마감관리
    required_fields: [제출물 준비 상태, 누락 항목, 담당자]
    escalation: 결정권자에게 누락 경고
  - notification_id: competition_grant_due_1_day
    target: 공모전/지원사업
    trigger: status=승인됨
    timing: 마감 1일 전
    responsible_agent: meiko
    channel: 최종-승인요청
    required_fields: [최종 제출 확인, 남은 리스크]
    escalation: 결정권자 최종 확인 요청
  - notification_id: marketing_approval_waiting_24h
    target: 마케팅 발행
    trigger: status=승인대기
    timing: 승인 요청 후 24시간 미응답
    responsible_agent: lucy
    channel: 최종-승인요청
    required_fields: [안건명, 대기 시간, 리스크]
    escalation: 결정권자 리마인드
  - notification_id: rag_update_indexed
    target: RAG 업데이트
    trigger: new file indexed
    timing: 인덱싱 완료 시
    responsible_agent: reze
    channel: brand-rag
    required_fields: [파일명, 폴더, 요약, 관련 에이전트]
    escalation: 관련 부서에 요약 공유
    notes: 원본 파일 업로드 금지, secret 제외
