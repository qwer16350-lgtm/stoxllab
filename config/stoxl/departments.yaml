version: 1
source: docs/planning/STOXL_Hermes_Discord_Agent_Implementation_Guide.xlsx
departments:
  decision_makers:
    department_id: decision_makers
    display_name: 결정권자
    purpose: 최종 결정, 승인 결과, 운영 원칙 확정
    members: [김태호_STOXL, 이주호_STOXL]
    decision_flow:
      - 주요 외부 실행은 두 결정권자 모두 승인 필요
      - 내부 보류/폐기는 한 명 승인으로 가능
    default_channels: [공지-결정사항, 대표-회의실, 최종-승인요청]

  marketing_team:
    department_id: marketing_team
    display_name: 마케팅팀
    purpose: SNS, 홈페이지, 브랜드 발신, 마케팅 전략 담당
    members: [lucy, marin]
    decision_flow:
      - 마린이 초안과 리서치를 작성한다.
      - 루시가 브랜드 톤과 공개 가능성을 검토한다.
      - 공식 발행은 결정권자 승인 없이는 불가하다.
    default_channels: [marketing-brief, lucy-검토, marin-초안, sns-콘텐츠, homepage]

  operation_team:
    department_id: operation_team
    display_name: 운영팀
    purpose: 공모전, 지원사업, 외부 일정, 내부 일정 관리
    members: [meiko, kasumi]
    decision_flow:
      - 카스미가 후보와 조건을 수집한다.
      - 메이코가 추천/보류/비추천과 리스크를 판단한다.
      - 제출과 외부 연락은 결정권자 승인 없이는 불가하다.
    default_channels: [operation-brief, meiko-검토, kasumi-리서치, 공모전-지원사업, 일정-마감관리]

  strategy_office:
    department_id: strategy_office
    display_name: 전략기획실
    purpose: 브랜드 해석, 제품/사업 방향 제안
    members: [reze]
    decision_flow:
      - 레제가 전략 의견과 비평을 제시한다.
      - 실무 명령권은 없으며 결정권자 논의로 넘긴다.
    default_channels: [reze-전략기획, brand-rag, new-business, product-ideas, 대표-회의실]
