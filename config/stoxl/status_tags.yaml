version: 1
status_tags:
  - status_id: discovered
    display_name: 발견됨
    description: 새 후보 또는 아이디어가 발견됨
    allowed_next_statuses: [검토중, 보류, 폐기]
    final_state: false
  - status_id: draft
    display_name: 초안
    description: 후임 또는 전략 봇이 초안을 작성함
    allowed_next_statuses: [검토중, 수정필요, 보류]
    final_state: false
  - status_id: reviewing
    display_name: 검토중
    description: 선임 또는 결정권자가 검토 중
    allowed_next_statuses: [추천, 수정필요, 보류, 비추천, 승인대기]
    final_state: false
  - status_id: revision_needed
    display_name: 수정필요
    description: 수정 없이는 다음 단계로 갈 수 없음
    allowed_next_statuses: [초안, 검토중, 보류]
    final_state: false
  - status_id: recommended
    display_name: 추천
    description: 선임 또는 전략 봇이 진행을 추천함
    allowed_next_statuses: [승인대기, 보류, 진행중]
    final_state: false
  - status_id: not_recommended
    display_name: 비추천
    description: 진행하지 않는 것을 추천함
    allowed_next_statuses: [보류, 폐기]
    final_state: false
  - status_id: held
    display_name: 보류
    description: 당장 진행하지 않고 보관
    allowed_next_statuses: [검토중, 폐기, 아카이브]
    final_state: false
  - status_id: approval_pending
    display_name: 승인대기
    description: 결정권자 승인 필요
    allowed_next_statuses: [승인됨, 보류, 폐기]
    final_state: false
  - status_id: approved
    display_name: 승인됨
    description: 결정권자 승인 완료
    allowed_next_statuses: [진행중, 완료]
    final_state: false
  - status_id: in_progress
    display_name: 진행중
    description: 승인 후 실행 준비 중
    allowed_next_statuses: [완료, 보류, 폐기]
    final_state: false
  - status_id: completed
    display_name: 완료
    description: 업무 완료
    allowed_next_statuses: [아카이브]
    final_state: true
  - status_id: discarded
    display_name: 폐기
    description: 진행하지 않기로 결정
    allowed_next_statuses: [아카이브]
    final_state: true
  - status_id: archived
    display_name: 아카이브
    description: 기록 보관 완료
    allowed_next_statuses: []
    final_state: true
